<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Atlas de la Comisión Corográfica de Colombia (1850-1859)</title>

  <!-- 1. Carga la base de datos de láminas unificadas -->
  <script src="laminas_completas.js"></script>

  <!-- 2. Librerías de mapas y agrupación de puntos -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background-color: #f5eedb;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #332211;
    }

    header {
      background-color: #2e1d11;
      color: #ecdcc1;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #8c5b2c;
      gap: 12px;
    }

    .header-titulo h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .header-titulo p {
      margin: 2px 0 0 0;
      font-size: 0.8rem;
      font-style: italic;
      color: #d1b896;
    }

    .controles {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }

    select, button {
      font-family: 'Georgia', serif;
      background: #8c5b2c;
      color: white;
      border: 1px solid #d4b28c;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    select:hover, button:hover {
      background: #a97039;
    }

    /* Estilo del botón destacado para el Atlas del Banco de la República */
    .btn-atlas {
      background: #4a210d;
      color: #ffd89b !important;
      border: 1px solid #ffd89b;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .btn-atlas:hover {
      background: #7a3a1e;
      color: #ffffff !important;
      border-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    #contador {
      font-weight: bold;
      color: #ffd89b;
      font-size: 0.85rem;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    /* Diseño editorial de los recuadros emergentes */
    .popup-laminas {
      max-width: 295px;
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .popup-laminas h3 {
      margin: 0 0 4px 0;
      font-size: 1.05rem;
      color: #632b13;
      border-bottom: 1px solid #d8be9b;
      padding-bottom: 3px;
    }

    .popup-laminas .metadatos {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 6px;
    }

    .popup-laminas a.enlace-img {
      display: block;
      cursor: zoom-in;
    }

    .popup-laminas img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      border: 1px solid #8c5b2c;
      margin: 4px 0;
      border-radius: 3px;
      background-color: #eee;
    }

    .popup-laminas blockquote {
      margin: 6px 0;
      padding-left: 8px;
      border-left: 3px solid #8c5b2c;
      font-style: italic;
      color: #2b1f14;
      background: #fbf6ec;
      padding-top: 3px;
      padding-bottom: 3px;
      max-height: 85px;
      overflow-y: auto;
    }

    .btn-bnc {
      display: block;
      text-align: center;
      background: #632b13;
      color: #fff !important;
      padding: 6px;
      text-decoration: none;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 8px;
    }

    .btn-bnc:hover {
      background: #8c3e1c;
    }
  </style>
</head>
<body>

    // 3. FUNCIÓN DE LIMPIEZA Y GEORREFERENCIACIÓN INTELIGENTE
    function depurarLaminas(listaBruta) {
      return listaBruta.map(item => {
        const textoCompleto = (item.provincia || "") + " " + (item.cita || "");

        // A. Extraer título legible sin códigos técnicos del catálogo
        let nombreLimpio = item.nombre;
        if (!nombreLimpio || nombreLimpio.trim() === "") {
          nombreLimpio = (item.provincia || "")
            .replace(/^\s*\d+\.\s*—?\s*/, "")
            .split("[")[0]
            .split(":")[0]
            .trim();
        }

        // B. Determinar pintor exacto
        let pintorReal = item.pintor;
        const textoNorm = textoCompleto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        
        if (textoNorm.includes("fernandez") || textoNorm.includes("carmelo")) {
          pintorReal = "Carmelo Fernández";
        } else if (textoNorm.includes("price") || textoNorm.includes("enrique")) {
          pintorReal = "Henry Price";
        } else if (textoNorm.includes("paz") || textoNorm.includes("manuel maria")) {
          pintorReal = "Manuel María Paz";
        }

        // C. Generar enlace oficial limpio en alta resolución
        let imgLimpia = item.img;
        const assetMatch = (item.img + " " + item.cita + " " + item.url_bnc).match(/(?:asset|thumbnail)\/(\d+)\/0/i);
        if (assetMatch) {
          imgLimpia = `https://catalogoenlinea.bibliotecanacional.gov.co/client/es_ES/search/asset/${assetMatch[1]}/0`;
        }

        // D. Georreferenciación de alta precisión (evalúa sitios puntuales primero)
        let coordsReales = [4.5709, -74.2973];
        for (let sitio in coordenadas) {
          if (textoNorm.includes(sitio)) {
            coordsReales = coordenadas[sitio];
            break;
          }
        }

        // E. Extraer lugar/provincia para los metadatos
        let lugarProvincia = "Colombia";
        if (item.provincia) {
          const partes = item.provincia.split(":");
          if (partes.length > 1) {
            lugarProvincia = partes[partes.length - 1].split("/")[0].trim();
          } else {
            lugarProvincia = item.provincia.replace(/^\s*\d+\.\s*—?\s*/, "").split("/")[0].trim();
          }
        }

        return {
          nombre: nombreLimpio,
          pintor: pintorReal,
          ano: item.ano || 1853,
          provincia: lugarProvincia,
          coords: coordsReales,
          img: imgLimpia,
          cita: item.cita ? item.cita.split("—")[0].replace(/^\s*\d+\.\s*—?\s*/, "").trim() : nombreLimpio,
          url_bnc: imgLimpia
        };
      });
    }

    // 4. Renderizar las láminas en el mapa interactivo
    let laminasProcesadas = [];

    function renderizarPuntos(datos) {
      clusterGroup.clearLayers();

      datos.forEach(item => {
        const popupHtml = `
          <div class="popup-laminas">
            <h3>${item.nombre}</h3>
            <div class="metadatos">
              <b>Artista:</b> ${item.pintor} (${item.ano})<br>
              <b>Lugar:</b> ${item.provincia}
            </div>

            <a class="enlace-img" href="${item.img}" target="_blank" title="Haz clic para ver en tamaño completo">
              <img src="${item.img}" alt="${item.nombre}">
            </a>

            <blockquote>${item.cita}</blockquote>

            <a class="btn-bnc" href="${item.url_bnc}" target="_blank">
              🔎 Ver lámina oficial en la BNC
            </a>
          </div>
        `;

        const marcador = L.marker(item.coords).bindPopup(popupHtml);
        clusterGroup.addLayer(marcador);
      });

      map.addLayer(clusterGroup);
      document.getElementById('contador').textContent = `Láminas visibles: ${datos.length}`;
    }

    // 5. Filtrar por pintor
    function aplicarFiltro() {
      const seleccion = document.getElementById('filtroPintor').value;
      if (seleccion === "todos") {
        renderizarPuntos(laminasProcesadas);
      } else {
        const filtradas = laminasProcesadas.filter(l => l.pintor === seleccion);
        renderizarPuntos(filtradas);
      }
    }

    // 6. Carga inicial y auto-reparación
    if (typeof coleccionLaminas !== 'undefined' && Array.isArray(coleccionLaminas)) {
      laminasProcesadas = depurarLaminas(coleccionLaminas);
      renderizarPuntos(laminasProcesadas);
    } else {
      alert("⚠️ Aviso:\nNo se encontró la variable 'coleccionLaminas'. Asegúrate de que 'laminas_completas.js' esté guardado en la misma carpeta.");
    }

    // 7. Descargar copia local del HTML
    function descargarHTML() {
      const contenido = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([contenido], { type: "text/html;charset=utf-8" });
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(blob);
      enlace.download = "atlas_comision_corografica_colombia.html";
      enlace.click();
    }
  </script>
</body>
